<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1014">
<title>My Day</title>
<meta name="apple-mobile-web-app-title" content="My Day">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<script async src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script async id="chartjs" src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0e1014;--card:#171a21;--card2:#1e222b;--line:#272c36;--text:#eef1f6;--muted:#8d96a6;
  --accent:#7cf29c;--blue:#6ab7ff;--yellow:#ffd166;--pink:#ff8fab;--cyan:#4dd6e8;--warn:#ffb454;--danger:#ff6b6b;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;background:rgba(14,16,20,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px;flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)}.sync.local i{background:var(--warn)}
.icon{background:transparent;padding:6px 8px;font-size:20px}
main{padding:4px 14px calc(env(safe-area-inset-bottom) + 150px);max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;background:rgba(18,20,26,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav::after{content:'';position:absolute;left:0;right:0;top:100%;height:300px;background:rgb(18,20,26)}
html{background:rgb(18,20,26)}body{min-height:100vh;background:var(--bg)}
nav button{background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 8px;flex:1}
nav button b{font-size:21px;font-weight:400;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--text)}nav button.on b{filter:none;opacity:1}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0}
.ct{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px}
.ct .link{margin-left:auto}
.link{background:transparent;color:var(--accent);padding:4px 6px;font-weight:600;font-size:14px}
.muted{color:var(--muted)}.small{font-size:12.5px}.warn{color:var(--warn)}
.hello{font-size:24px;font-weight:800;margin:10px 4px 4px;letter-spacing:-.4px}
.hello .muted{font-size:14px;font-weight:500;letter-spacing:0}
.cal{display:flex;gap:16px;align-items:center}
.ringwrap{position:relative;flex:none}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-size:26px;letter-spacing:-.5px}.ringtxt span{font-size:12px;color:var(--muted)}
.macros{flex:1;display:flex;flex-direction:column;gap:8px}
.mrow .top{display:flex;justify-content:space-between;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px}
.big{font-size:24px;font-weight:800;letter-spacing:-.4px}.big small{font-size:14px;color:var(--muted);font-weight:500}
.btns{display:flex;gap:8px;margin-top:10px}.btns button{flex:1}
.primary{background:var(--accent);color:#0b1a10;font-weight:700;width:100%;padding:14px;margin-top:12px}
.ghost{background:transparent;border:1px solid var(--line)}
.danger{background:transparent;color:var(--danger);width:100%;margin-top:6px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.task{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{width:26px;height:26px;border-radius:50%;padding:0;flex:none;border:2px solid var(--muted);background:transparent;color:#0b1a10;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.task.done .chk{background:var(--accent);border-color:var(--accent)}
.task.done .tt>div:first-child{text-decoration:line-through;color:var(--muted)}
.tt{flex:1;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item b{font-variant-numeric:tabular-nums}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:4;background:var(--accent);color:#0b1a10;font-weight:800;padding:14px 20px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.datenav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.datenav div{font-weight:700;font-size:17px}
.datenav button{width:44px;font-size:20px;padding:6px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats4 b{display:block;font-size:17px}.stats4 span{font-size:11.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{padding:8px 13px;border-radius:20px;font-size:14px;background:var(--card2)}
.chip.on{background:var(--accent);color:#0b1a10;font-weight:700}
.setchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.setchips span{background:var(--card2);border-radius:10px;padding:4px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.badge{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--card2);color:var(--muted);font-weight:600}
.tip{background:rgba(124,242,156,.09);border:1px solid rgba(124,242,156,.25);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:8px}
.tip.up{background:rgba(106,183,255,.1);border-color:rgba(106,183,255,.3)}
.mini{padding:5px 0;font-size:14px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 20px);max-width:640px;margin:0 auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.x{position:absolute;right:12px;top:10px;background:transparent;font-size:18px;color:var(--muted)}
.sheet-panel h3{margin:6px 0 10px;font-size:19px;padding-right:30px}
.sheet-panel label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;background:var(--card2);border-radius:14px;padding:13px;font-size:22px;cursor:pointer}
.tile b{font-size:15px;margin-top:4px}.tile span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.amt{display:flex;gap:8px;align-items:center;margin:12px 0}
.amt input{text-align:center;font-size:20px;font-weight:700}
.amt button{width:48px;font-size:20px;flex:none}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;background:var(--card2);border-radius:14px;padding:12px}
.preview b{display:block;font-size:18px}.preview span{font-size:11.5px;color:var(--muted)}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 36px;gap:8px;align-items:center;margin:6px 0}
.setrow .n{color:var(--muted);font-size:13px}
.setrow button{padding:8px;background:transparent;color:var(--muted)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin:6px 0}
.seg button{flex:1;background:transparent;padding:9px}
.seg button.on{background:var(--line);font-weight:700}
.busy{text-align:center;padding:36px 0}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 140px);background:#2a2f3a;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:88vw;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.chartbox{position:relative;height:200px}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.check input{width:20px;height:20px;flex:none}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}.scanbox video{width:100%;height:100%;object-fit:cover;display:block}.scanline{position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.btnl{display:flex;align-items:center;justify-content:center;padding:10px;border-radius:12px;font-size:14px;cursor:pointer;background:transparent;border:1px solid var(--line)}
.tblwrap{overflow-x:auto;margin:6px -4px}.bt{width:100%;border-collapse:separate;border-spacing:2px;font-size:12.5px;font-variant-numeric:tabular-nums}.bt th,.bt td{padding:6px 3px;text-align:center;border-radius:6px}.bt th{color:var(--muted);font-weight:600;font-size:11.5px}.bt tr th:first-child{text-align:left;white-space:nowrap}.bt td{background:var(--card2)}
ol.steps{padding-left:20px;margin:10px 0;font-size:14px;line-height:1.5}ol.steps li{margin:6px 0}code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:13px}
.sec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 2px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">My Day</div>
    <div class="sync" id="sync"><i></i><span>Saved on phone</span></div>
    <button class="icon" data-act="settings" aria-label="Settings">⚙︎</button>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <button data-act="tab" data-v="today"><b>🏠</b>Today</button>
    <button data-act="tab" data-v="food"><b>🍽️</b>Food</button>
    <button data-act="tab" data-v="train"><b>🏋️</b>Train</button>
    <button data-act="tab" data-v="tasks"><b>✅</b>Tasks</button>
    <button data-act="tab" data-v="progress"><b>📈</b>Progress</button>
  </nav>
</div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(+n||0);
const r1=n=>Math.round((+n||0)*10)/10;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const gen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function localDate(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
const TODAY=()=>localDate(new Date());
function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
function dow(ds){return new Date(ds+'T12:00:00').getDay()}
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtShort(ds){const d=new Date(ds+'T12:00:00');return `${DN[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}`}
function fmtDay(ds){const t=TODAY();if(ds===t)return 'Today';if(ds===addDays(t,-1))return 'Yesterday';if(ds===addDays(t,1))return 'Tomorrow';return fmtShort(ds)}
function fmtTime(t){if(!t)return '';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${ap}`}
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
function greeting(){const h=new Date().getHours();return h<5?'Late night':h<12?'Good morning':h<17?'Good afternoon':'Good evening'}

/* ---------- constants ---------- */
const APP_VERSION='1.5 (16 Nov)';
const DEFAULT_SETTINGS={eatBack:50,bodyKg:110,kcal:2300,protein:170,carbs:230,fat:75,water:3000,name:'Zuhair'};
const DEFAULT_EXERCISES=["Goblet squat","Dumbbell RDL","Incline dumbbell press","Push-ups","Dumbbell row","Lat pulldown","Plank (sec)","Leg press","Dumbbell shoulder press","Bicep curl","Triceps pushdown","Chest press machine","Seated cable row","Lunges"];
const TEMPLATES={"Full body A":["Goblet squat","Incline dumbbell press","Dumbbell row","Plank (sec)"],"Full body B":["Dumbbell RDL","Push-ups","Lat pulldown","Plank (sec)"]};
const CARDIO=["Incline walk","Walk","Run","Swimming","Bike","Elliptical","Stair climber","Football","Other"];
const MEALS=["Breakfast","Lunch","Dinner","Snack"];
const REPEAT={none:'Once',daily:'Every day',weekdays:'Weekdays (Mon–Fri)',weekly:'Every week'};
const RPE_TXT={1:'Very easy',2:'Easy',3:'Easy',4:'Light',5:'Moderate',6:'Moderate',7:'Hard, 3 reps left',8:'Hard, 2 reps left',9:'Very hard, 1 rep left',10:'Max effort'};
function defaultMeal(){const h=new Date().getHours();return h<11?'Breakfast':h<16?'Lunch':h<21?'Dinner':'Snack'}

/* ---------- state & storage ---------- */
const state={docs:{},tab:'today',date:TODAY(),mode:'local'};
const LS='myday-docs-v1';

function settings(){return Object.assign({},DEFAULT_SETTINGS,state.docs.settings||{})}
function foods(){return (state.docs.foods&&state.docs.foods.items)||{}}
function tasksAll(){return (state.docs.tasks&&state.docs.tasks.items)||[]}
function exercises(){const s=settings();const extra=new Set();allDays().forEach(d=>(d.workouts||[]).forEach(w=>w.type!=='cardio'&&extra.add(w.name)));return [...new Set([...(s.exercises&&s.exercises.length?s.exercises:DEFAULT_EXERCISES),...extra])]}
const dayId=ds=>'day-'+ds;
function getDay(ds){const d=state.docs[dayId(ds)];return Object.assign({date:ds,meals:[],water:0,workouts:[],weight:null},d?clone(d):{})}
function allDays(){return Object.keys(state.docs).filter(k=>k.startsWith('day-')).map(k=>state.docs[k]).filter(d=>d&&d.date).sort((a,b)=>a.date<b.date?-1:1)}
let saveT=null;
function save(id,body){state.docs[id]=body;clearTimeout(saveT);saveT=setTimeout(localSave,120);render()}
function updateDay(ds,fn){const d=getDay(ds);d.date=ds;fn(d);save(dayId(ds),d)}
function localSave(){clearTimeout(saveT);try{localStorage.setItem(LS,JSON.stringify(state.docs))}catch(e){toast("Couldn't save on this phone. Storage may be full.",4000)}}
window.addEventListener('pagehide',localSave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)localSave()});
function localLoad(){try{return JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){return {}}}
function setSync(kind,text){const s=$('#sync');s.className='sync '+kind;s.querySelector('span').textContent=text}
async function init(){
  state.docs=localLoad();setSync('ok','Saved on phone');render();
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{});
    let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;localSave();location.reload()});
  }
  let last=0;try{last=+localStorage.getItem('myday-lastbackup')||0}catch(e){}
  if(Object.keys(state.docs).length>5&&Date.now()-last>7*864e5)setTimeout(()=>toast('Tip: make a backup in ⚙︎ Settings',4000),1500);
}

/* ---------- barcode & Open Food Facts ---------- */
async function prepImage(file,max=1400){
  let src;try{src=await createImageBitmap(file)}catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  const s=Math.min(1,max/Math.max(src.width,src.height));const c=document.createElement('canvas');c.width=Math.round(src.width*s);c.height=Math.round(src.height*s);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);return {canvas:c}
}
function scaled(c,f){if(f===1)return c;const n=document.createElement('canvas');n.width=Math.round(c.width*f);n.height=Math.round(c.height*f);n.getContext('2d').drawImage(c,0,0,n.width,n.height);return n}
function zxHints(){const Z=window.ZXing,h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128]);h.set(Z.DecodeHintType.TRY_HARDER,true);return h}
async function decodeBarcode(canvas){
  if('BarcodeDetector' in window){try{const d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});const r=await d.detect(canvas);if(r&&r[0])return r[0].rawValue}catch(e){}}
  if(window.ZXing){try{const Z=window.ZXing,reader=new Z.MultiFormatReader();reader.setHints(zxHints());
    for(const f of [1,.6,.4]){try{const lum=new Z.HTMLCanvasElementLuminanceSource(scaled(canvas,f));const res=reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(lum)));if(res)return res.getText()}catch(e){}}}catch(e){}}
  return null;
}
const OFF='https://world.openfoodfacts.org',OFF_FIELDS='code,product_name,product_name_en,brands,serving_size,serving_quantity,nutriments';
function offToFood(p,code){
  const n=p.nutriments||{},sq=num(p.serving_quantity),has=k=>n[k]!==undefined&&n[k]!==null&&n[k]!=='';
  const k100=has('energy-kcal_100g')?num(n['energy-kcal_100g']):has('energy_100g')?num(n['energy_100g'])/4.184:null;
  const hasServ=has('energy-kcal_serving');
  const food={name:(p.product_name_en||p.product_name||'').trim()||'Unknown product',brand:String(p.brands||'').split(',')[0].trim(),barcode:code||p.code||''};
  if(sq>0&&k100!==null){const f=sq/100;Object.assign(food,{servingLabel:p.serving_size||`${sq} g`,servingG:sq,kcal:r0(k100*f),p:r1(num(n.proteins_100g)*f),c:r1(num(n.carbohydrates_100g)*f),f:r1(num(n.fat_100g)*f)})}
  else if(hasServ)Object.assign(food,{servingLabel:p.serving_size||'1 serving',servingG:sq||null,kcal:r0(num(n['energy-kcal_serving'])),p:r1(num(n.proteins_serving)),c:r1(num(n.carbohydrates_serving)),f:r1(num(n.fat_serving))});
  else Object.assign(food,{servingLabel:'100 g',servingG:100,kcal:r0(k100),p:r1(num(n.proteins_100g)),c:r1(num(n.carbohydrates_100g)),f:r1(num(n.fat_100g))});
  food.incomplete=k100===null&&!hasServ;return food;
}
async function getJSON(url){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function offLookup(code){const j=await getJSON(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);return j&&j.status===1&&j.product?offToFood(j.product,code):null}
async function offSearch(q){const j=await getJSON(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&fields=${OFF_FIELDS}`);return ((j&&j.products)||[]).map(p=>offToFood(p)).filter(f=>!f.incomplete&&f.name!=='Unknown product')}
let scanReader=null;
function stopScan(){try{scanReader&&scanReader.reset()}catch(e){}scanReader=null}

/* ---------- tasks logic ---------- */
const isRec=t=>t.repeat&&t.repeat!=='none';
function dueOn(t,ds){

}
function tasksForDate(ds){

    else if(ds===today&&!t.done&&(!t.date||t.date<today))out.push({...t,_date:ds,_done:false,_overdue:!!t.date});

/* ---------- training logic ---------- */
const norm=s=>String(s||'').trim().toLowerCase();
const rep=(n,o)=>Array.from({length:n},()=>({...o}));

function lastEntry(name,beforeDs){const n=norm(name);const days=allDays().filter(d=>d.date<beforeDs).reverse();for(const d of days){const e=(d.workouts||[]).find(x=>x.type!=='cardio'&&norm(x.name)===n);if(e)return {date:d.date,e}}return null}

  const sets=(e.sets||[]).filter(s=>num(s.reps)>0);if(!sets.length)return null;
  const n=sets.length,kg=Math.max(...sets.map(s=>num(s.kg))),top=sets.filter(s=>num(s.kg)===kg),minR=Math.min(...top.map(s=>num(s.reps))),rpe=num(e.rpe)||8;
  if(isTimed(e.name)){const nx=minR>=60?minR+10:minR+5;return {text:`Next time: ${n} × ${nx} s${minR>=60?' (or a harder variation)':''}`,prefill:rep(n,{reps:nx,kg:0})}}

  if(minR<8||rpe>=10)return {text:`Tough one. Stay at ${kg} kg (or drop to ${Math.max(0,kg-step)} kg) and build back up to 8+ reps.`,prefill:rep(n,{reps:8,kg})};

function suggest(name,ds){

function setsTxt(e){const t=isTimed(e.name);return (e.sets||[]).map(s=>t?`${r0(s.reps)} s`:num(s.kg)?`${r0(s.reps)} × ${r1(s.kg)} kg`:`${r0(s.reps)} reps`)}

const TREAD=['Incline walk','Walk','Run'];

const METS={'Incline walk':[5,6,8],'Walk':[3,3.5,4.3],'Run':[8,9.8,11.5],'Swimming':[5.8,8.3,9.8],'Bike':[4.8,6.8,8.8],'Elliptical':[4,5,6.5],'Stair climber':[6,8.8,9],'Football':[7,7,10],'Other':[4,5.5,7]};

// ACSM metabolic equations: walking below ~7 km/h, running above
function treadKcalMin(kmh,incline,kg){const v=kmh*1000/60,g=incline/100;const vo2=kmh<7?0.1*v+1.8*v*g+3.5:0.2*v+0.9*v*g+3.5;return vo2*kg/1000*5}

function cardioKcal(e){if(num(e.kcalManual))return num(e.kcalManual);const kg=bodyKg(),min=num(e.minutes);if(TREAD.includes(e.name)&&num(e.speed))return treadKcalMin(num(e.speed),num(e.incline),kg)*min;return metKcalMin(e.name,e.rpe,kg)*min}

const stepsKcal=steps=>num(steps)*bodyKg()*0.0004; // ~0.5 kcal per kg per km, ~0.78 m per step
function burnedFor(day){

  const h=day.health||{};const act=num(h.active)||(num(h.steps)?stepsKcal(h.steps):0);

  return {total,cardio,act,src:!total?'':act>=cardio?(num(h.active)?'Apple Health':'steps estimate'):'logged cardio'};
}
function budget(day,s){const b=burnedFor(day),back=b.total*(num(s.eatBack)/100);return {b,back,target:s.kcal+back}}
function parseHealth(txt){
  if(!txt||!/MYDAY/i.test(txt))return null;
  const get=k=>{const m=txt.match(new RegExp(k+'\\s*=\\s*([^|\\n]*)','i'));return m?m[1].trim():''};
  const n=v=>{const m=String(v).replace(/,(?=\d{3}\b)/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):0};
  let ds=get('date');const dm=ds.match(/\d{4}-\d{2}-\d{2}/);ds=dm?dm[0]:TODAY();
  const wRaw=get('weight');let w=n(wRaw);if(/lb/i.test(wRaw))w=w*0.4536;
  return {date:ds,steps:r0(n(get('steps'))),active:r0(n(get('active'))),weight:w?r1(w):0};
}
function applyHealth(h){
  updateDay(h.date,d=>{d.health={steps:h.steps,active:h.active,at:Date.now()};if(h.weight>30&&h.weight<300&&!d.weight)d.weight=h.weight});

  <div class="row"><div><label class="f">Calories</label><input id="k" inputmode="decimal" value="${entry?r0(entry.kcal):''}"></div><div><label class="f">Protein g</label><input id="p" inputmode="decimal" value="${entry?r1(entry.p):''}"></div></div>
  <div class="row"><div><label class="f">Carbs g</label><input id="c" inputmode="decimal" value="${entry?r1(entry.c):''}"></div><div><label class="f">Fat g</label><input id="f" inputmode="decimal" value="${entry?r1(entry.f):''}"></div></div>
  ${entry?'':'<label class="check" style="border:0"><input type="checkbox" id="keep" checked> Save to my foods for next time</label>'}
  <button class="primary" id="sv">${entry?'Update':'Add to log'}</button>${entry?'<button class="danger" id="del">Remove from log</button>':''}`,p=>{
    $$('#mc .chip',p).forEach(b=>b.onclick=()=>{cur=b.dataset.m;$$('#mc .chip',p).forEach(x=>x.classList.toggle('on',x===b))});
    $('#sv',p).onclick=()=>{const name=$('#n',p).value.trim()||'Quick add';const v={kcal:num($('#k',p).value),p:num($('#p',p).value),c:num($('#c',p).value),f:num($('#f',p).value)};
      if(!v.kcal&&!v.p)return toast('Add at least calories');
      let foodId=entry?entry.foodId:null;
      if(!entry&&$('#keep',p).checked){const fd=clone(state.docs.foods||{items:{}});foodId=gen();fd.items[foodId]={id:foodId,name,brand:'',barcode:'',servingLabel:'1 serving',servingG:null,...v,lastUsed:Date.now()};save('foods',fd)}
      const e={id:entry?entry.id:gen(),meal:cur,name,foodId,qty:1,unit:'serv',servingLabel:entry?entry.servingLabel:'1 serving',...v};
      updateDay(entry?entry._ds:ds,d=>{const i=d.meals.findIndex(x=>x.id===e.id);if(i>=0)d.meals[i]=e;else d.meals.push(e)});closeSheet();toast('Logged')};
    if(entry)$('#del',p).onclick=()=>{updateDay(entry._ds,d=>{d.meals=d.meals.filter(x=>x.id!==entry.id)});closeSheet();toast('Removed')};
  });
}
function sheetOnline(meal,ds,q0){
  openSheet(`<h3>Search foods online</h3><div class="row"><input id="q" placeholder="e.g. Almarai Greek yogurt" value="${esc(q0||'')}" enterkeyhint="search"><button id="go" style="flex:none">Search</button></div>
  <div class="muted small" style="margin-top:6px">From Open Food Facts, a free community food database. Packaged foods work best. For home-cooked food or restaurants, use Quick add.</div><div id="res" style="margin-top:6px"></div>`,p=>{
    const run=async()=>{const q=$('#q',p).value.trim();if(!q)return;$('#q',p).blur();$('#res',p).innerHTML='<div class="busy" style="padding:20px 0"><div class="spin"></div></div>';
      try{const list=await offSearch(q);
        $('#res',p).innerHTML=list.length?list.map((f,i)=>`<div class="item" data-i="${i}"><div><div>${esc(f.name)}</div><div class="muted small">${esc(f.brand?f.brand+' · ':'')}${esc(f.servingLabel)} · P ${r0(f.p)}g</div></div><b>${r0(f.kcal)}</b></div>`).join(''):'<div class="empty">No results. Try other words (brand + product works best), or use Quick add.</div>';
        $$('[data-i]',p).forEach(el=>el.onclick=()=>sheetFoodEdit(list[+el.dataset.i],meal,ds,'From Open Food Facts. Check the numbers, then save.'))}
      catch(e){$('#res',p).innerHTML='<div class="empty">Search failed. Check your internet and try again.</div>'}};
    $('#go',p).onclick=run;$('#q',p).onkeydown=e=>{if(e.key==='Enter')run()};if(q0)run();
  });
}
function editEntry(id){const ds=logDate(),day=getDay(ds),e=day.meals.find(x=>x.id===id);if(!e)return;const ent={...e,_ds:ds};const f=e.foodId&&foods()[e.foodId];if(f)sheetAmount(f,e.meal,ds,ent);else sheetQuick(e.meal,ds,ent)}

/* weight */
function sheetWeight(){const ds=TODAY(),d=getDay(ds);const prev=allDays().filter(x=>x.weight&&x.date<ds).pop();
  openSheet(`<h3>Log weight · Today</h3><div class="amt"><input id="w" type="number" inputmode="decimal" step="0.1" value="${d.weight||(prev?prev.weight:'')}" placeholder="kg"></div>${prev?`<div class="muted small">Last: ${r1(prev.weight)} kg on ${fmtShort(prev.date)}</div>`:''}<button class="primary" id="sv">Save</button>${d.weight?'<button class="danger" id="del">Clear today\'s weight</button>':''}`,p=>{
  $('#sv',p).onclick=()=>{const w=num($('#w',p).value);if(w<30||w>300)return toast('Enter your weight in kg');updateDay(ds,x=>x.weight=w);closeSheet();toast('Weight saved')};
  if(d.weight)$('#del',p).onclick=()=>{updateDay(ds,x=>x.weight=null);closeSheet()}})}

/* tasks */
function sheetTask(id){
  const t=id?tasksAll().find(x=>x.id===id):null;const v=t||{title:'',date:TODAY(),time:'',repeat:'none',notes:''};
  openSheet(`<h3>${t?'Edit task':'New task'}</h3><label class="f">Task</label><input id="ti" value="${esc(v.title)}" placeholder="e.g. Submit Case Study 2">
  <div class="row"><div><label class="f">${isRec(v)?'Starts':'Date'}</label><input id="d" type="date" value="${esc(v.date||'')}"></div><div><label class="f">Time</label><input id="tm" type="time" value="${esc(v.time||'')}"></div></div>
  <label class="f">Repeat</label><select id="rp">${Object.entries(REPEAT).map(([k,l])=>`<option value="${k}" ${v.repeat===k?'selected':''}>${l}</option>`).join('')}</select>
  <label class="f">Notes</label><input id="no" value="${esc(v.notes||'')}" placeholder="optional">
  <div class="muted small" style="margin-top:6px">Leave the date empty for an "anytime" task. It stays on Today until you tick it.</div>
  <button class="primary" id="sv">${t?'Save':'Add task'}</button>${t?'<button class="danger" id="del">Delete task</button>':''}`,p=>{
    $('#sv',p).onclick=()=>{const title=$('#ti',p).value.trim();if(!title)return toast('Write the task');const doc=clone(state.docs.tasks||{items:[]});
      const nt={...(t||{id:gen(),created:TODAY(),done:false,doneDates:[]}),title,date:$('#d',p).value||'',time:$('#tm',p).value||'',repeat:$('#rp',p).value,notes:$('#no',p).value.trim()};
      if(nt.repeat!=='none'&&!nt.date)nt.date=TODAY();
      const i=doc.items.findIndex(x=>x.id===nt.id);if(i>=0)doc.items[i]=nt;else doc.items.push(nt);save('tasks',doc);closeSheet();toast(t?'Saved':'Task added')};
    if(t)$('#del',p).onclick=()=>{const doc=clone(state.docs.tasks);doc.items=doc.items.filter(x=>x.id!==t.id);save('tasks',doc);closeSheet();toast('Deleted')};
  });
}

/* training */
function sheetTemplate(name){const ds=state.date,list=TEMPLATES[name],done=new Set((getDay(ds).workouts||[]).map(e=>norm(e.name)));
  openSheet(`<h3>${esc(name)}</h3><div class="muted small">Tap an exercise to log it. Targets are based on your last session.</div>${list.map(ex=>{const s=suggest(ex,ds);return `<div class="item" data-ex="${esc(ex)}"><div><div>${done.has(norm(ex))?'✅ ':''}${esc(ex)}</div><div class="muted small">${s.last?`Last (${fmtShort(s.last.date)}): ${setsTxt(s.last.e).join(', ')}`:'Not logged yet'}</div><div class="small" style="color:${s.up?'var(--blue)':'var(--accent)'};margin-top:2px">${esc(s.text)}</div></div><span class="muted">›</span></div>`}).join('')}
  <div class="tip" style="margin-top:12px">Warm up 5 min first. Keep 1–2 reps in reserve, and rest 60–90 s between sets.</div>`,p=>{$$('[data-ex]',p).forEach(el=>el.onclick=()=>sheetExercise(ds,null,el.dataset.ex))})}
function sheetExercise(ds,entry,presetName,cardio){
  let e=entry?clone(entry):{id:gen(),type:cardio?'cardio':'strength',name:presetName||(cardio?CARDIO[0]:''),sets:[],rpe:7,notes:'',minutes:30,km:''};
  if(!entry&&e.type==='strength'&&presetName)e.sets=clone(suggest(presetName,ds).prefill);
  if(!entry&&e.type==='strength'&&!e.sets.length)e.sets=rep(3,{reps:10,kg:''});
  const sync=p=>{if(e.type==='strength'){e.name=$('#en',p).value.trim();e.sets=$$('.srow',p).map(r=>({reps:num($('.rr',r).value),kg:$('.kk',r)?num($('.kk',r).value):0}))}else{e.name=$('#cn',p).value;e.minutes=num($('#mn',p).value);e.km=num($('#km',p).value)||'';e.speed=$('#sp',p)?num($('#sp',p).value)||'':'';e.incline=$('#inc',p)?num($('#inc',p).value):'';e.kcalManual=num($('#kcm',p).value)||''}e.rpe=num($('#rpe',p).value);e.notes=$('#nt',p).value.trim()};
  const draw=()=>{
    const timed=isTimed(e.name),s=e.type==='strength'?suggest(e.name,ds):null;
    openSheet(`<h3>${entry?'Edit':'Log'} ${e.type==='cardio'?'cardio':'exercise'} · ${fmtDay(ds)}</h3>
    ${entry?'':`<div class="seg"><button data-ty="strength" class="${e.type==='strength'?'on':''}">💪 Strength</button><button data-ty="cardio" class="${e.type==='cardio'?'on':''}">🏃 Cardio</button></div>`}
    ${e.type==='strength'?`<label class="f">Exercise</label><input id="en" list="exl" value="${esc(e.name)}" placeholder="Choose or type"><datalist id="exl">${exercises().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
      ${s&&e.name?`<div class="tip ${s.up?'up':''}">${s.last?`<div class="muted small">Last time (${fmtShort(s.last.date)}): ${setsTxt(s.last.e).join(', ')} · RPE ${s.last.e.rpe||'–'}</div>`:''}${s.up?'⬆️':'🎯'} ${esc(s.text)}</div>`:''}
      <div class="setrow muted small" style="margin-top:12px"><span></span><span>${timed?'Seconds':'Reps'}</span><span>${timed?'':'Weight (kg)'}</span><span></span></div>
      ${e.sets.map((x,i)=>`<div class="setrow srow"><span class="n">Set ${i+1}</span><input class="rr" inputmode="numeric" type="number" value="${x.reps===''?'':esc(x.reps)}">${timed?'<span></span>':`<input class="kk" inputmode="decimal" type="number" step="any" value="${x.kg===''?'':esc(x.kg)}" placeholder="0 = bodyweight">`}<button data-rm="${i}" aria-label="Remove set">✕</button></div>`).join('')}
      <button class="ghost" id="as" style="width:100%;margin-top:4px">+ Add set</button>`
    :`<label class="f">Activity</label><select id="cn">${[...new Set([...CARDIO,e.name])].map(x=>`<option ${x===e.name?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <div class="row"><div><label class="f">Minutes</label><input id="mn" type="number" inputmode="numeric" value="${esc(e.minutes)}"></div><div><label class="f">Distance km</label><input id="km" type="number" inputmode="decimal" step="any" value="${esc(e.km)}" placeholder="optional"></div></div>
      ${TREAD.includes(e.name)?`<div class="row"><div><label class="f">Speed km/h</label><input id="sp" type="number" inputmode="decimal" step="any" value="${esc(e.speed||'')}" placeholder="e.g. 5.5"></div><div><label class="f">Incline %</label><input id="inc" type="number" inputmode="decimal" step="any" value="${esc(e.incline===undefined?'':e.incline)}" placeholder="e.g. 10"></div></div>`:''}
      <label class="f">Calories from the machine (optional)</label><input id="kcm" type="number" inputmode="numeric" value="${esc(e.kcalManual||'')}" placeholder="leave empty to use my estimate">
      <div class="tip" id="kc"></div>`}
    <label class="f">Intensity (RPE): <b id="rl">${e.rpe} · ${RPE_TXT[e.rpe]||''}</b></label><input id="rpe" type="range" min="1" max="10" step="1" value="${e.rpe}" style="padding:0;accent-color:#7cf29c">
    <label class="f">Notes</label><input id="nt" value="${esc(e.notes)}" placeholder="e.g. felt knee on last set">
    <button class="primary" id="sv">${entry?'Save':'Log it'}</button>${entry?'<button class="danger" id="del">Delete</button>':''}`,p=>{
      $$('[data-ty]',p).forEach(b=>b.onclick=()=>{sync(p);e.type=b.dataset.ty;e.name=e.type==='cardio'?CARDIO[0]:'';if(e.type==='strength'&&!e.sets.length)e.sets=rep(3,{reps:10,kg:''});draw()});
      const est=()=>{if(e.type!=='cardio')return;sync(p);const k=cardioKcal(e);$('#kc',p).innerHTML=`🔥 ≈ <b>${r0(k)} kcal</b> ${num(e.kcalManual)?'(from machine)':TREAD.includes(e.name)&&num(e.speed)?`at ${r1(e.speed)} km/h, ${r1(e.incline)}% for ${r0(e.minutes)} min`:`for ${r0(e.minutes)} min at RPE ${e.rpe}${TREAD.includes(e.name)?'. Add speed & incline for a better estimate':''}`}`};
      $('#rpe',p).oninput=ev=>{$('#rl',p).textContent=ev.target.value+' · '+(RPE_TXT[ev.target.value]||'');est()};
      if(e.type==='cardio'){['#mn','#sp','#inc','#kcm'].forEach(id=>{const el=$(id,p);if(el)el.oninput=est});$('#cn',p).onchange=()=>{sync(p);draw()};est()}
      if(e.type==='strength'){
        $('#en',p).onchange=()=>{const old=e.name;sync(p);if(!entry&&norm(old)!==norm(e.name)&&e.name){const sg=suggest(e.name,ds);e.sets=clone(sg.prefill)}draw()};
        $('#as',p).onclick=()=>{sync(p);const l=e.sets[e.sets.length-1]||{reps:10,kg:''};e.sets.push({...l});draw()};
        $$('[data-rm]',p).forEach(b=>b.onclick=()=>{sync(p);e.sets.splice(+b.dataset.rm,1);draw()});
      }
      $('#sv',p).onclick=()=>{sync(p);if(!e.name)return toast('Choose an exercise');
        if(e.type==='strength'){e.sets=e.sets.filter(x=>x.reps>0);if(!e.sets.length)return toast('Add at least one set')}
        if(e.type==='cardio'){if(!num(e.minutes))return toast('Add the minutes');e.kcal=r0(cardioKcal(e))}
        updateDay(ds,d=>{d.workouts=d.workouts||[];const i=d.workouts.findIndex(x=>x.id===e.id);if(i>=0)d.workouts[i]=e;else d.workouts.push(e)});
        closeSheet();const a=e.type==='strength'?advice(e):null;toast(a?'Logged. Next: '+a.text:e.type==='cardio'?`Logged: ~${e.kcal} kcal burned 🔥`:'Logged 💪',a?4500:2600)};
      if(entry)$('#del',p).onclick=()=>{updateDay(ds,d=>{d.workouts=(d.workouts||[]).filter(x=>x.id!==e.id)});closeSheet();toast('Deleted')};
    });
  };
  draw();
}

/* settings */
function sheetSettings(){const s=settings();
  openSheet(`<h3>Settings</h3>
  <label class="f">Your name</label><input id="nm" value="${esc(s.name||'')}">
  <div class="muted small" style="margin-top:12px">Daily targets</div>
  <div class="row"><div><label class="f">Calories</label><input id="k" inputmode="numeric" value="${s.kcal}"></div><div><label class="f">Protein g</label><input id="p" inputmode="numeric" value="${s.protein}"></div></div>
  <div class="row"><div><label class="f">Carbs g</label><input id="c" inputmode="numeric" value="${s.carbs}"></div><div><label class="f">Fat g</label><input id="f" inputmode="numeric" value="${s.fat}"></div></div>
  <div class="row"><div><label class="f">Water ml</label><input id="w" inputmode="numeric" value="${s.water}"></div><div><label class="f">Body weight kg</label><input id="bw" inputmode="decimal" value="${s.bodyKg}"></div></div><div class="muted small">Body weight is used for calorie-burn estimates until you log your weight.</div>
  <label class="f">Add burned calories back to my budget</label><select id="eb">${[[0,'0%: keep the budget fixed (fastest loss)'],[50,'50%: recommended'],[100,'100%: eat it all back']].map(([v,l])=>`<option value="${v}" ${num(s.eatBack)===v?'selected':''}>${l}</option>`).join('')}</select>
  <div class="muted small">Burn estimates from watches and formulas often run high, so adding back half is the safer middle ground.</div>
  <button class="ghost" id="hs" style="width:100%;margin-top:10px">👟 Set up Apple Health / Fitbit sync</button>
  <label class="f">My exercise list (one per line)</label><textarea id="ex" style="min-height:140px">${esc((s.exercises&&s.exercises.length?s.exercises:DEFAULT_EXERCISES).join('\n'))}</textarea>
  <button class="primary" id="sv">Save settings</button>
  <div class="sec" style="margin-left:0">Backup</div>
  <div class="muted small">Your data lives only on this phone. Back up every week or so and keep the file in iCloud Drive (Files app).</div>
  <button class="ghost" id="bk" style="width:100%;margin-top:10px">⬇️ Back up my data</button>
  <label class="ghost btnl" style="margin-top:8px">⬆️ Restore from a backup file<input type="file" accept=".json,application/json,text/plain" id="rs" hidden></label>
  <button class="link" id="pst" style="width:100%;margin-top:6px">Restore from copied text</button><div class="muted small" style="text-align:center;margin-top:14px">My Day version ${APP_VERSION}</div>`,p=>{
    $('#sv',p).onclick=()=>{const ns={...(state.docs.settings||{}),name:$('#nm',p).value.trim(),kcal:num($('#k',p).value)||2300,protein:num($('#p',p).value)||170,carbs:num($('#c',p).value)||230,fat:num($('#f',p).value)||75,water:num($('#w',p).value)||3000,bodyKg:num($('#bw',p).value)||110,eatBack:num($('#eb',p).value),exercises:$('#ex',p).value.split('\n').map(x=>x.trim()).filter(Boolean)};save('settings',ns);closeSheet();toast('Settings saved')};
    $('#hs',p).onclick=sheetShortcutHelp;
    $('#bk',p).onclick=async()=>{localSave();const json=JSON.stringify({app:'myday',v:1,exportedAt:new Date().toISOString(),docs:state.docs});const name=`myday-backup-${TODAY()}.json`;
      try{const file=new File([json],name,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'My Day backup'});
        else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove()}
        try{localStorage.setItem('myday-lastbackup',Date.now())}catch(e){}toast('Backup ready. Save it to Files.')}
      catch(e){if(!e||e.name!=='AbortError')toast("Couldn't make the backup file")}};
    const restore=txt=>{let j;try{j=JSON.parse(txt)}catch(e){return toast("That isn't a My Day backup")}
      const docs=j&&j.docs?j.docs:j;if(!docs||typeof docs!=='object'||!Object.keys(docs).some(k=>k.startsWith('day-')||['tasks','foods','settings'].includes(k)))return toast("That isn't a My Day backup");
      if(!confirm('Replace everything on this phone with this backup?'))return;state.docs=docs;localSave();closeSheet();render();toast('Restored ✓')};
    $('#rs',p).onchange=async e=>{const f=e.target.files[0];if(f)restore(await f.text())};
    $('#pst',p).onclick=async()=>{try{restore(await navigator.clipboard.readText())}catch(e){toast("Couldn't read the clipboard")}};
  })}

/* ---------- events ---------- */
$('#app').addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  if(a==='toggleTask'){ev.stopPropagation();return toggleTask(el.dataset.id,el.dataset.date)}
  switch(a){
    case 'tab':state.tab=v;if(v==='food'||v==='train')state.date=state.date||TODAY();render();window.scrollTo(0,0);break;
    case 'day':state.date=addDays(state.date,+v);render();break;
    case 'goToday':state.date=TODAY();render();break;
    case 'water':updateDay(TODAY(),d=>d.water=Math.max(0,(d.water||0)+(+v)));break;
    case 'addFood':sheetAddFood(el.dataset.meal);break;
    case 'editEntry':editEntry(el.dataset.id);break;
    case 'addTask':sheetTask();break;
    case 'editTask':sheetTask(el.dataset.id);break;
    case 'logWeight':sheetWeight();break;
    case 'addEx':sheetExercise(state.date);break;
    case 'addCardio':sheetExercise(state.date,null,null,true);break;
    case 'editEx':{const e=(getDay(state.date).workouts||[]).find(x=>x.id===el.dataset.id);if(e)sheetExercise(state.date,e);break}
    case 'template':sheetTemplate(v);break;
    case 'burnTable':sheetBurnTable();break;
    case 'importHealth':importHealth();break;
    case 'shortcutHelp':sheetShortcutHelp();break;
    case 'settings':sheetSettings();break;
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(state.date&&state.tab==='today')state.date=TODAY();render()}});
init();
</script>
</body>
